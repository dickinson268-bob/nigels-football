name: Update football standings

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch the eight league tables
        run: node update-standings.mjs

      - name: Save the new standings
        run: |
          git config user.name "standings bot"
          git config user.email "bot@users.noreply.github.com"
          git add standings.json
          git diff --staged --quiet || git commit -m "Standings update"
          git push
